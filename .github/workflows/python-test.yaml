name: Python tests/coverage

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/bubble_sandbox/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/bubble_sandbox/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  test-bubble-sandbox:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
            # Only run coverage on Python >= 3.13.
            - python-version: "3.12"
              pytest-args: "--no-cov"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e . --group dev

      - name: Setup 'bare' environment
        working-directory: "environments/bare"
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install -e .

      - name: Setup 'pandas-only' environment
        working-directory: "environments/pandas-only"
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install -e .

      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 denies unprivileged user namespaces, so bwrap
          # cannot configure loopback in the netns '--unshare-net' makes.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          pip list
          py.test -s ${{ matrix.pytest-args }} 2>&1 | tee unit-tests.log

      # Functional tests are excluded by pytest's testpaths setting.
      - name: Run functional tests against real bwrap
        run: |
          set -o pipefail
          py.test -s --no-cov tests/functional 2>&1 | tee functional-tests.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #25), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Python ${{ matrix.python-version }} failed"
            echo
            for log in unit-tests.log functional-tests.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log (last 50 lines)</summary>"
              echo
              echo '```'
              tail -n 50 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
