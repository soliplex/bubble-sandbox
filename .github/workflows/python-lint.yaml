name: Python linting

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/bubble_sandbox/**'
      - 'tests/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/bubble_sandbox/**'
      - 'tests/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  lint-bubble-sandbox:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e . --group dev

      - name: Check formatting
        run: |
          set -o pipefail
          ruff format --check 2>&1 | tee ruff-format.log

      - name: Run ruff linter
        run: |
          set -o pipefail
          ruff check 2>&1 | tee ruff-check.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #25), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Linting failed"
            echo
            for log in ruff-format.log ruff-check.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log</summary>"
              echo
              echo '```'
              tail -n 100 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
