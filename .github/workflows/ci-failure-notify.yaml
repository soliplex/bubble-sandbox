name: Notify Slack on CI failure

# Added per #25. Unlike the other repositories in the organization, the
# workflows below never had an inline Slack step to remove -- this
# repository simply had no CI failure notification at all. The important
# half of #25 still applies: they check out untrusted pull-request code, so
# the notification must not live inside them, and they must never hold
# `secrets.SLACK_NOTIFY_URL` (a fork PR would not see it anyway -- #23).
#
# `workflow_run` always runs in the base-repository context with secrets
# available, whatever repository the triggering run came from. It links to
# the failing run; the run's own step summary carries the details.
#
# This repository has no gitleaks / trufflehog workflows, so only the two
# Python workflows are listed. Add them here if secret scans are introduced.
on:
  workflow_run:
    workflows:
      - "Python tests/coverage"
      - "Python linting"
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # A real newline; `toJSON` below escapes it as `\n` in the payload.
      NEWLINE: "\n"
    steps:
      - name: Send Slack notification for the failed run
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_NOTIFY_URL }}
          webhook-type: incoming-webhook
          # The branch name and run title come from the contributor's fork,
          # so build the message with `format` and let `toJSON` emit it as a
          # single, correctly escaped JSON string.
          payload: |
            {
              "channel": "#soliplex",
              "username": "bubble-sandbox",
              "text": ${{ toJSON(format(':x: *{0}* failed on `{1}`:{4}{2}{4}{3}', github.event.workflow_run.name, github.event.workflow_run.head_branch, github.event.workflow_run.display_title, github.event.workflow_run.html_url, env.NEWLINE)) }},
              "icon_emoji": ":ghost:"
            }
